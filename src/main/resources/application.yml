spring:
  application:
    name: ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shop}
    username: shop
    password: shop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiration-minutes: 60
  admin:
    email: admin@shop.local
    password: admin12345
    full-name: Shop Admin
