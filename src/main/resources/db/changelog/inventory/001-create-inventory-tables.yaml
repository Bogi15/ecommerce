databaseChangeLog:
  - changeSet:
      id: inventory-001-create-stock-items
      author: shop
      changes:
        - createTable:
            tableName: stock_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_stock_items_product
              - column:
                  name: quantity_available
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: quantity_reserved
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE stock_items ADD CONSTRAINT ck_stock_items_non_negative CHECK (quantity_available >= 0 AND quantity_reserved >= 0)

  - changeSet:
      id: inventory-002-create-stock-reservations
      author: shop
      changes:
        - createTable:
            tableName: stock_reservations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: stock_reservations
            columnNames: order_id, product_id
            constraintName: uq_stock_reservations_order_product
